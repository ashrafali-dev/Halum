name: probe-model
on:
  workflow_dispatch:
  push:
    branches: [probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet onnxruntime numpy pillow
      - name: Download model + fixture
        run: |
          mkdir -p probe
          curl -sSL -o probe/detector.onnx https://huggingface.co/ogkalu/comic-text-and-bubble-detector/resolve/main/detector-v4-s_int8.onnx
          curl -sSL -o probe/frieren.jpg https://raw.githubusercontent.com/zbu1/manga-translator-cli/main/docs/frieren_raw.jpg
          ls -l probe/
      - name: Probe
        run: python .github/probe/probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-out
          path: probe/
