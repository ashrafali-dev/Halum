name: probe-model
on:
  workflow_dispatch:
  push:
    branches: [probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet onnxruntime numpy pillow
      - name: Fetch
        run: |
          mkdir -p probe
          curl -sSL -o probe/migan.onnx https://huggingface.co/lxfater/inpaint-web/resolve/main/migan.onnx
          curl -sSL -o probe/frieren.jpg https://raw.githubusercontent.com/zbu1/manga-translator-cli/main/docs/frieren_raw.jpg
          ls -l probe/
      - name: Probe inpaint
        run: python .github/probe/probe_inpaint.py
