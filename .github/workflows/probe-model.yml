name: probe-model
on:
  workflow_dispatch:
  push:
    branches: [probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet ultralytics pillow numpy
      - name: Fetch
        run: |
          mkdir -p probe
          curl -sSL -o probe/best.pt https://huggingface.co/juithealien/manga109-segmentation-bubble/resolve/main/best.pt
          curl -sSL -o probe/frieren.jpg https://raw.githubusercontent.com/zbu1/manga-translator-cli/main/docs/frieren_raw.jpg
          ls -l probe/
      - name: Probe bubble model
        run: python .github/probe/probe_bubble.py
