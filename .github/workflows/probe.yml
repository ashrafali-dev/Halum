name: probe

on:
  push:
    branches: [main]
    paths: ['.probe-trigger']

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate fixtures in place
        run: |
          python3 tools/lens_fixture.py --out fixtures --write
          echo "=== CHECK ==="
          python3 tools/lens_fixture.py --out fixtures --check
          echo "=== DIFF ==="
          git status --short fixtures
          od -A d -t x1 fixtures/lens_ja.bin
          od -A d -t x1 fixtures/lens_ko.bin
      - uses: actions/upload-artifact@v4
        with:
          name: regenerated-fixtures
          path: fixtures/lens_*.bin
