name: probe

on:
  push:
    branches: [main]
    paths: ['.probe-trigger']

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate fixtures from expected JSON
        run: |
          python3 tools/lens_fixture.py --out build/fixtures --write
          echo "=== CHECK REGENERATED ==="
          python3 tools/lens_fixture.py --out build/fixtures --check
          echo "=== CHECK COMMITTED ==="
          python3 tools/lens_fixture.py --out fixtures --check || true
      - uses: actions/upload-artifact@v4
        with:
          name: regenerated-fixtures
          path: build/fixtures
