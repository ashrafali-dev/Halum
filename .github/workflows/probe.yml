name: probe

on:
  push:
    branches: [main]
    paths: ['.probe-trigger']

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate fixtures in place
        run: |
          python3 tools/lens_fixture.py --out fixtures --write
          echo "=== CHECK ==="
          python3 tools/lens_fixture.py --out fixtures --check || true
      - name: Dump regenerated bytes
        run: |
          for f in fixtures/lens_*.bin; do
            echo "== $f"
            base64 -w 0 "$f"
            echo
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regenerated-fixtures
          path: fixtures/lens_*.bin
