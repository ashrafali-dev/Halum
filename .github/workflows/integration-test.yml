name: integration-test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-checks:
    name: fixtures, bubble recall, inpaint, bridge mock
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Python deps
        run: |
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet numpy pillow opencv-python-headless onnxruntime pytest

      - name: Model cache
        uses: actions/cache@v4
        with:
          path: .cache/models
          key: models-${{ runner.os }}-bubble-v1-${{ hashFiles('tools/export_bubble.py', 'tools/fetch_models.sh') }}
          restore-keys: models-${{ runner.os }}-bubble-v1-

      - name: Fetch + export models
        run: bash tools/fetch_models.sh
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      - name: Integration suite
        run: python3 tools/integration_test.py --fixtures fixtures --models app/src/main/assets/models --out build/integration

      - name: JVM end-to-end (Lens replay -> parser -> planner -> bridge mock)
        run: ./gradlew --no-daemon testDebugUnitTest --tests 'app.halum.integration.*'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-report
          path: build/integration
          if-no-files-found: ignore
