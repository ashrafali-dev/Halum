name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Model cache
        uses: actions/cache@v4
        with:
          path: .cache/models
          key: models-${{ runner.os }}-bubble-v1-${{ hashFiles('tools/export_bubble.py', 'tools/fetch_models.sh') }}
          restore-keys: models-${{ runner.os }}-bubble-v1-

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch + export models (bubble)
        run: bash tools/fetch_models.sh
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      - name: Unit tests
        # Flavors split the task name; run one flavor (tests are identical).
        run: ./gradlew --no-daemon testStandardDebugUnitTest

      - name: Assemble debug (both flavors)
        run: ./gradlew --no-daemon assembleDebug

      # D21 (final): the default `standard` flavor is the universal fat APK
      # (both ABIs, no MI-GAN) and is the artifact that must pass AC10. The
      # `full` flavor adds MI-GAN and may exceed 70 MB — it is reported, not
      # gated.
      - name: Size gate — standard flavor (universal, no MI-GAN)
        run: |
          apk=$(ls app/build/outputs/apk/standard/debug/*.apk)
          python3 tools/report_sizes.py "$apk" app/src/main/assets/models

      - name: APK ABI check — standard flavor
        run: |
          apk=$(ls app/build/outputs/apk/standard/debug/*.apk)
          python3 tools/check_abi.py "$apk"

      - name: Size report — full flavor (with MI-GAN, not gated)
        run: |
          apk=$(ls app/build/outputs/apk/full/debug/*.apk)
          HALUM_REQUIRE_MODELS=0 python3 tools/report_sizes.py \
            "$apk" app/src/main/assets/models app/src/full/assets/models || true

      - name: Unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testStandardDebugUnitTest
          if-no-files-found: ignore

      - name: APKs
        uses: actions/upload-artifact@v4
        with:
          name: halum-debug-apks
          path: app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
