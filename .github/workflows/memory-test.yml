name: memory-test

# Disk and CPU heavy: 32-bit API 34 emulator + 10 min scripted scan.
# Not a required check on PRs (DECISIONS D14.9); run on demand and nightly.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

concurrency:
  group: memory-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator-32bit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 system-images;android-34;default;x86'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Fetch + export models
        run: bash tools/fetch_models.sh

      - name: Assemble
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest

      - name: Run scripted scan on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86
          abi: x86
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -memory 192
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            ./gradlew --no-daemon connectedDebugAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.class=app.halum.MemoryScanTest
            adb logcat -d > logcat.txt
            python3 tools/check_logcat.py logcat.txt --max-scan-seconds 600

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: memory-test-logcat
          path: logcat.txt
          if-no-files-found: ignore
